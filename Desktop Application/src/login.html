<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Video Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:             #090a0f;
    --card-bg:        #12151e;
    --card-border:    #232838;
    --input-bg:       #0a0c12;
    --input-border:   #232838;
    --input-focus:    #2E8F63;
    --accent:         #2E8F63;
    --accent-hover:   #34A870;
    --accent-glow:    rgba(46, 143, 99, 0.2);
    --text:           #F8FAFC;
    --text-sub:       #94A3B8;
    --text-muted:     #64748B;
    --danger:         #F87171;
    --danger-bg:      #2A1417;
    --danger-border:  #991B1B;
    --font:           "Inter", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  html, body {
    height: 100%;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden !important;
    -ms-overflow-style: none !important;
    scrollbar-width: none !important;
  }

  ::-webkit-scrollbar {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
  }

  /* ── Titlebar ── */
  .titlebar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 38px;
    padding: 0 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--card-border);
    -webkit-app-region: drag;
  }

  .titlebar h1 {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-sub);
    letter-spacing: 0.05em;
  }

  .titlebar-close {
    -webkit-app-region: no-drag;
    width: 24px;
    height: 24px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .titlebar-close:hover {
    background: rgba(248, 113, 113, 0.15);
    color: var(--danger);
  }

  /* ── Main Container ── */
  .wrapper {
    height: calc(100vh - 38px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 24px 20px;
    overflow: hidden;
  }

  /* ── Official Brand Logo Image ── */
  .brand-logo-container {
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .brand-logo-img {
    max-width: 250px;
    max-height: 60px;
    width: auto;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 20px rgba(46, 143, 99, 0.2));
  }

  .header-subtitle {
    font-size: 13px;
    color: var(--text-sub);
    margin-bottom: 16px;
    text-align: center;
    font-weight: 400;
  }

  /* ── Card Container ── */
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 24px 24px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.03);
  }

  /* ── Fields ── */
  .field-group {
    margin-bottom: 14px;
  }

  .field-group label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-sub);
    margin-bottom: 6px;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrapper input {
    width: 100%;
    height: 40px;
    padding: 0 38px 0 12px;
    font-family: var(--font);
    font-size: 13px;
    color: var(--text);
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 9px;
    outline: none;
    transition: all 0.2s ease;
  }

  .input-wrapper input::placeholder {
    color: var(--text-muted);
  }

  .input-wrapper input:focus {
    border-color: var(--input-focus);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  /* Input Error State */
  .field-group.has-error input {
    border-color: var(--danger) !important;
    background: var(--danger-bg) !important;
  }
  .field-group.has-error input:focus {
    box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.2) !important;
  }

  .error-text {
    font-size: 11px;
    color: var(--danger);
    margin-top: 4px;
    display: none;
  }
  .field-group.has-error .error-text {
    display: block;
  }

  /* Toggle Password Eye Icon */
  .toggle-password {
    position: absolute;
    right: 10px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
  }
  .toggle-password:hover {
    color: var(--text-sub);
  }

  /* ── Extra Options Row (Remember me / Forgot Password) ── */
  .options-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    font-size: 12px;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-sub);
    cursor: pointer;
    user-select: none;
  }

  .checkbox-label input[type="checkbox"] {
    width: 15px;
    height: 15px;
    accent-color: var(--accent);
    cursor: pointer;
    border-radius: 4px;
  }

  .forgot-link {
    color: var(--text-sub);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.15s ease;
  }
  .forgot-link:hover {
    color: var(--accent);
    text-decoration: underline;
  }

  /* ── Primary Submit Button (Calm Emerald Green) ── */
  .btn-submit {
    width: 100%;
    height: 40px;
    background: linear-gradient(135deg, #2E8F63, #1E6B47);
    color: #FFFFFF;
    border: none;
    border-radius: 9px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(46, 143, 99, 0.25);
  }
  .btn-submit:hover {
    background: linear-gradient(135deg, #34A870, #247650);
    box-shadow: 0 6px 18px rgba(46, 143, 99, 0.35);
    transform: translateY(-1px);
  }
  .btn-submit:active {
    transform: translateY(0);
  }
  .btn-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* ── Divider ── */
  .divider {
    display: flex;
    align-items: center;
    margin: 16px 0;
    gap: 10px;
    color: var(--text-muted);
    font-size: 11px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--card-border);
  }

  /* ── Social Buttons ── */
  .btn-social {
    width: 100%;
    height: 40px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 9px;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 0;
    transition: all 0.2s ease;
  }
  .btn-social:hover {
    background: #181c28;
    border-color: #38425d;
  }
  .btn-social:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .social-icon {
    width: 17px;
    height: 17px;
  }

  /* ── Footer ── */
  .footer-text {
    margin-top: 18px;
    font-size: 13px;
    color: var(--text-sub);
    text-align: center;
  }

  .toggle-auth-link {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
    margin-left: 4px;
  }
  .toggle-auth-link:hover {
    text-decoration: underline;
  }

  .hidden {
    display: none !important;
  }
</style>
</head>
<body>

  <div class="titlebar">
    <h1>Video Studio</h1>
    <button class="titlebar-close" id="closeBtn" title="Quit">✕</button>
  </div>

  <div class="wrapper">
    <!-- Official Envision Tech Sol Brand Logo Image -->
    <div class="brand-logo-container">
      <img src="logo-main.png" alt="Envision Tech Sol Logo" class="brand-logo-img" />
    </div>

    <h2 class="header-subtitle" id="pageSubtitle">Just sign in if you have an account in here</h2>

    <div class="card">
      <form id="authForm" onsubmit="return false;">
        
        <!-- Name Field (Visible only in Sign Up mode) -->
        <div class="field-group hidden" id="nameGroup">
          <label for="nameInput">Full Name</label>
          <div class="input-wrapper">
            <input type="text" id="nameInput" autocomplete="off" />
          </div>
        </div>

        <!-- Email Field -->
        <div class="field-group" id="emailGroup">
          <label for="emailInput">Email</label>
          <div class="input-wrapper">
            <input type="email" id="emailInput" autocomplete="off" spellcheck="false" />
          </div>
          <p class="error-text" id="emailError">We don't have an account with that email address.</p>
        </div>

        <!-- Password Field -->
        <div class="field-group" id="passwordGroup">
          <label for="passwordInput">Password</label>
          <div class="input-wrapper">
            <input type="password" id="passwordInput" autocomplete="off" />
            <button type="button" class="toggle-password" id="togglePasswordBtn" title="Show / Hide Password">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <p class="error-text" id="passwordError">Invalid password.</p>
        </div>

        <!-- Options Row (Remember Me / Forgot Password) -->
        <div class="options-row" id="optionsRow">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" checked />
            Remember Me
          </label>
          <a href="#" class="forgot-link" id="forgotBtn">Forgot Password?</a>
        </div>

        <!-- Main Submit Button -->
        <button type="submit" class="btn-submit" id="submitBtn">Log in</button>
      </form>

      <!-- Divider -->
      <div class="divider">or</div>

      <!-- Social Buttons -->
      <button class="btn-social" id="googleBtn">
        <svg class="social-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continue with Google
      </button>
    </div>

    <!-- Footer Toggle Mode -->
    <div class="footer-text">
      <span id="footerPrompt">Don’t have an account?</span>
      <a href="#" class="toggle-auth-link" id="toggleAuthBtn">Sign up</a>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    let isSignUpMode = false;

    const pageSubtitle = $("pageSubtitle");
    const nameGroup = $("nameGroup");
    const emailGroup = $("emailGroup");
    const passwordGroup = $("passwordGroup");
    const emailInput = $("emailInput");
    const passwordInput = $("passwordInput");
    const nameInput = $("nameInput");
    const emailError = $("emailError");
    const passwordError = $("passwordError");
    const submitBtn = $("submitBtn");
    const googleBtn = $("googleBtn");
    const togglePasswordBtn = $("togglePasswordBtn");
    const toggleAuthBtn = $("toggleAuthBtn");
    const footerPrompt = $("footerPrompt");
    const optionsRow = $("optionsRow");
    const closeBtn = $("closeBtn");

    // Toggle Password Visibility
    let isPasswordVisible = false;
    togglePasswordBtn.addEventListener("click", () => {
      isPasswordVisible = !isPasswordVisible;
      passwordInput.type = isPasswordVisible ? "text" : "password";
    });

    // Toggle Sign In vs Sign Up mode
    toggleAuthBtn.addEventListener("click", (e) => {
      e.preventDefault();
      isSignUpMode = !isSignUpMode;
      clearErrors();

      if (isSignUpMode) {
        pageSubtitle.textContent = "Create your account to get started";
        submitBtn.textContent = "Sign up";
        nameGroup.classList.remove("hidden");
        optionsRow.classList.add("hidden");
        footerPrompt.textContent = "Already have an account?";
        toggleAuthBtn.textContent = "Log in";
      } else {
        pageSubtitle.textContent = "Just sign in if you have an account in here";
        submitBtn.textContent = "Log in";
        nameGroup.classList.add("hidden");
        optionsRow.classList.remove("hidden");
        footerPrompt.textContent = "Don’t have an account?";
        toggleAuthBtn.textContent = "Sign up";
      }
    });

    function clearErrors() {
      emailGroup.classList.remove("has-error");
      passwordGroup.classList.remove("has-error");
    }

    function showEmailError(msg) {
      emailError.textContent = msg || "We don't have an account with that email address.";
      emailGroup.classList.add("has-error");
    }

    function showPasswordError(msg) {
      passwordError.textContent = msg || "Invalid password.";
      passwordGroup.classList.add("has-error");
    }

    // Submit Form
    $("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;
      const name = nameInput.value.trim();

      if (!email || !email.includes("@")) {
        showEmailError("Please enter a valid email address.");
        return;
      }

      if (!password) {
        showPasswordError("Please enter your password.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = isSignUpMode ? "Signing up..." : "Logging in...";

      try {
        await window.desktopAPI.saveConfig({
          googleSub: "user:" + email,
          googleEmail: email,
          googleName: name || email.split("@")[0],
        });

        window.desktopAPI.completeSignIn();
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = isSignUpMode ? "Sign up" : "Log in";
        showPasswordError(err.message || "Sign-in failed. Please try again.");
      }
    });

    // Google Sign-In Action
    googleBtn.addEventListener("click", async () => {
      googleBtn.disabled = true;
      submitBtn.disabled = true;
      clearErrors();

      try {
        const profile = await window.desktopAPI.signInWithGoogle();
        await window.desktopAPI.saveConfig({
          googleSub: profile.sub,
          googleEmail: profile.email,
          googleName: profile.name || undefined,
          googlePicture: profile.picture || undefined,
        });
        window.desktopAPI.completeSignIn();
      } catch (err) {
        googleBtn.disabled = false;
        submitBtn.disabled = false;
        showPasswordError(err && err.message ? err.message : "Google Sign-in failed.");
      }
    });

    closeBtn.addEventListener("click", () => {
      if (window.desktopAPI) window.desktopAPI.quit();
    });
  </script>
</body>
</html>
